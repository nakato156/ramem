version: 1
policy: deny_by_default
datasets:
  - name: MIRACL-es
    version: resolved_and_recorded_at_download
    url: https://huggingface.co/datasets/miracl/miracl
    license: Apache-2.0
    license_status: verified
    authorized_splits: [train, dev]
    sha256: null
    function: train_validation_test
    blocked: false
    notes: Downloader records the immutable HF revision and local tree SHA-256; test is not downloaded.
  - name: MIRACL-corpus-es
    version: resolved_and_recorded_at_download
    url: https://huggingface.co/datasets/miracl/miracl-corpus
    license: Apache-2.0
    license_status: verified
    authorized_splits: [train]
    sha256: null
    function: retrieval_corpus
    blocked: false
    notes: Downloader selects only the Spanish corpus and records revision and tree SHA-256.
  - name: MessIRve
    version: unpinned
    url: https://huggingface.co/datasets/spanish-ir/messirve
    license: unknown
    license_status: unverified
    authorized_splits: [train]
    sha256: null
    function: train
    blocked: true
    notes: Optional retrieval training source only if MIRACL is insufficient.
  - name: SQuAD-es
    version: v1.1.0_resolved_and_recorded_at_download
    url: https://huggingface.co/datasets/ccasimiro/squad_es
    license: CC-BY-4.0
    license_status: verified
    authorized_splits: [train]
    sha256: null
    function: train
    blocked: false
    notes: Only train is downloaded; a deterministic development slice is derived from train.
  - name: MLQA-es
    version: refs/convert/parquet_resolved_and_recorded_at_download
    url: https://huggingface.co/datasets/facebook/mlqa
    license: CC-BY-SA-3.0
    license_status: verified
    authorized_splits: [validation]
    sha256: recorded_in_data_raw_download_manifest
    function: development_only
    blocked: false
    notes: Only mlqa.es.es validation is downloaded for external development evaluation; official test remains inaccessible to the automated workflow.
  - name: XQuAD-es
    version: refs/convert/parquet_resolved_and_recorded_at_download
    url: https://huggingface.co/datasets/google/xquad
    license: CC-BY-SA-4.0
    license_status: verified
    authorized_splits: [validation]
    sha256: recorded_in_data_raw_download_manifest
    function: test_only
    blocked: true
    notes: Reserved one-time Spanish final holdout; downloader requires --release-test and the script requires RAMEM_RELEASE_CANDIDATE_FROZEN=yes.
  - name: CRAG
    version: unpinned
    url: https://github.com/facebookresearch/CRAG
    license: unknown
    license_status: unverified
    authorized_splits: [evaluation]
    sha256: null
    function: test_only
    blocked: true
    notes: Freeze web results with timestamp before reproducible evaluation.
  - name: LoCoMo
    version: 3eb6f2c585f5e1699204e3c3bdf7adc5c28cb376
    url: https://github.com/snap-research/locomo
    license: CC-BY-NC-4.0
    license_status: verified
    authorized_splits: [evaluation]
    sha256: null
    function: test_only
    blocked: false
    notes: Evaluation only; non-commercial license. Pin the repository at the declared commit and use data/locomo10.json with the official evaluators.
  - name: LongMemEval
    version: 98d7416c24c778c2fee6e6f3006e7a073259d48f
    url: https://huggingface.co/datasets/xiaowu0162/longmemeval-cleaned
    license: MIT
    license_status: verified
    authorized_splits: [test]
    sha256: null
    function: test_only
    blocked: false
    notes: Cleaned official dataset pinned to the declared Hugging Face revision; official evaluation code is pinned separately at Git commit 9e0b455f4ef0e2ab8f2e582289761153549043fc. Never use for training.
  - name: RAGTruth
    version: unpinned
    url: https://github.com/ParticleMedia/RAGTruth
    license: unknown
    license_status: unverified
    authorized_splits: [train, test]
    sha256: null
    function: train_validation_test
    blocked: true
    notes: Official train may train the verifier; official test remains reserved.
  - name: BEIR-subset
    version: unpinned
    url: https://github.com/beir-cellar/beir
    license: per_subdataset
    license_status: unverified
    authorized_splits: [test]
    sha256: null
    function: test_only
    blocked: true
    notes: Select two or three small domains and verify each underlying license.
